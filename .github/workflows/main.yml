name: CI Pipeline

on:
  push:
    branches:
      - main

jobs:

  build-api:

    runs-on: ubuntu-latest

    steps:

    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Restore
      run: dotnet restore StudentApi/StudentApi.csproj

    - name: Build
      run: dotnet build StudentApi/StudentApi.csproj --configuration Release --no-restore

    - name: Publish API
      run: dotnet publish StudentApi/StudentApi.csproj -c Release -o publish

    - name: Upload API Artifact
      uses: actions/upload-artifact@v4
      with:
        name: StudentApi
        path: publish/

  build-angular:

    runs-on: ubuntu-latest

    steps:

    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Install Packages
      run: |
        cd StudentUI
        npm install

    - name: Build Angular
      run: |
        cd StudentUI
        npm run build

    - name: Upload Angular Artifact
      uses: actions/upload-artifact@v4
      with:
        name: StudentUI
        path: StudentUI/dist/
